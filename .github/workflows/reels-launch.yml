name: Reels Launch Batch

on:
  workflow_dispatch:
    inputs:
      delivery:
        description: "Delivery mode (drive = upload to the shared Drive folder, instagram = post, drive,instagram = both)"
        required: false
        type: string
        default: "drive"

permissions:
  contents: write

concurrency:
  group: reels-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Drive libraries
        run: pip install --quiet google-api-python-client google-auth

      - name: Generate the 10 launch reels
        run: python3 automation/reels_bot.py --launch
        env:
          # --- OpenShorts + AI keys ---
          OPENSHORTS_API_URL: ${{ vars.OPENSHORTS_API_URL }}
          OPENSHORTS_API_KEY: ${{ secrets.OPENSHORTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          # --- delivery ---
          DELIVERY: ${{ github.event.inputs.delivery || 'drive' }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID || '150v_l6VkcaB_Fo4WtgKPZfar1yKu1KMe' }}
          DRIVE_SA_JSON: ${{ secrets.DRIVE_SA_JSON }}
          # --- generation knobs ---
          VIDEO_MODE: ${{ vars.VIDEO_MODE }}
          BILINGUAL: ${{ vars.BILINGUAL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PLATFORMS: ${{ vars.PLATFORMS }}

      - name: Commit state + log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "openshorts-bot[bot]"
          git config user.email "openshorts-bot[bot]@users.noreply.github.com"
          git add automation/state
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "bot: launch batch state update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
            echo "state committed and pushed"
          fi
